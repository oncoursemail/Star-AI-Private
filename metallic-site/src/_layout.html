<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#0b0b0e">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="{{canonical}}">{{robots}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Metallic">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site}}/assets/art/scenes/violet-nebula.jpg">
<meta property="og:image:width" content="640">
<meta property="og:image:height" content="360">
<meta property="og:image:alt" content="Night metal city: dark towers with lit windows under a full moon">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/brand/crow.ico" sizes="any">
<link rel="preload" href="/assets/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css{{v}}">
</head>
<body data-page="{{page}}">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="mark" href="/" aria-label="Metallic, home"><img src="/assets/brand/crow-silhouette-silver.svg" alt="" width="26" height="26"><span class="word">Metallic</span><span class="ea">Early Access</span></a>
    <nav class="links" aria-label="Main">
      <a href="/#revivals">Revivals</a>
      <a href="/news/"{{cur_news}}>News</a>
      <a href="/downloads/"{{cur_downloads}}>Downloads</a>
      <a href="https://discord.gg/yMytc2uAmj" rel="noopener">Discord</a>
    </nav>
    <a class="btn small" href="/downloads/" data-dl>Download</a>
  </div>
</header>
<main id="main">
{{content}}
</main>
<footer class="foot">
  <div class="foot-in">
    <a class="mark" href="/" aria-label="Metallic, home"><img src="/assets/brand/crow-silhouette-silver.svg" alt="" width="22" height="22"><span class="word">Metallic</span></a>
    <nav aria-label="Footer"><a href="/#revivals">Revivals</a><a href="/news/">News</a><a href="/downloads/">Downloads</a><a href="https://discord.gg/yMytc2uAmj" rel="noopener">Discord</a></nav>
    <p class="foot-end">&copy; {{year}} Metallic Early Access, for <span data-os>Windows</span>. No cookies, no trackers.</p>
  </div>
</footer>
<script src="/assets/site.js{{v}}" defer></script>
{{scripts}}
</body>
</html>

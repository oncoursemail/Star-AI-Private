<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#0b0b0e">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="/assets/brand/crow.ico">
<link rel="preload" href="/assets/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="{{page}}">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="mark" href="/" aria-label="Metallic, home"><img src="/assets/brand/crow-silhouette-silver.svg" alt="" width="28" height="28"><span>Metallic</span></a>
  <nav class="links" aria-label="Main">
    <a href="/#revivals">Revivals</a>
    <a href="/downloads/"{{cur_downloads}}>Downloads</a>
    <a href="/news/"{{cur_news}}>News</a>
  </nav>
  <a class="btn small" href="/downloads/" data-dl>Download</a>
</header>
<main id="main">
{{content}}
</main>
<footer class="foot">
  <p>Metallic Early Access, for Windows</p>
  <nav aria-label="Footer"><a href="/">Home</a><a href="/#revivals">Revivals</a><a href="/downloads/">Downloads</a><a href="/news/">News</a></nav>
  <p class="foot-end">&copy; {{year}} Metallic. No cookies, no trackers.</p>
</footer>
<script src="/assets/site.js" defer></script>
{{scripts}}
</body>
</html>

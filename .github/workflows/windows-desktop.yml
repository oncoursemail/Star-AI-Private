name: STAR Desktop — Build, Test & Release

on:
  push:
    branches: [main]
    paths:
      - 'star/**'
      - 'frontend/**'
      - 'star_desktop.py'
      - 'assets/**'
      - 'installer/**'
      - 'requirements*.txt'
      - 'scripts/build_windows.ps1'
      - 'scripts/check_windows_preview_budget.py'
      - 'scripts/smoke_windows_installer.ps1'
      - '.github/workflows/windows-desktop.yml'
      - 'tests/**'
  # The Windows runner is the owner's PC and is started only on demand, so a pull request runs these
  # jobs only when it carries the label windows-ci (adding the label starts the run).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'star/**'
      - 'frontend/**'
      - 'star_desktop.py'
      - 'assets/**'
      - 'installer/**'
      - 'requirements*.txt'
      - 'scripts/build_windows.ps1'
      - 'scripts/check_windows_preview_budget.py'
      - 'scripts/smoke_windows_installer.ps1'
      - '.github/workflows/windows-desktop.yml'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      preview_format:
        description: 'Optional download on a non-main branch; ordinary PR runs never upload previews'
        type: choice
        default: none
        options: [none, setup, portable]

# Serialize this workflow's artifact writers, including release handoffs. Normal PR
# validation stays parallel across refs and may cancel a superseded PR run.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.preview_format != 'none')) && 'star-windows-artifact-writer' || format('star-windows-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && inputs.preview_format == 'none') }}

# Layout: Linux React validation is still required. Each Windows job builds and tests
# its own React bundle from the checked-out commit, so PR validation needs no artifact
# storage. The offline suite still runs as two shards while windows-build packages,
# exercises, installs, and checks the exact binaries later offered for release.
# A release still needs every shard green: attest-release needs windows-tests, and
# publish-release needs attest-release. Check names: "Windows offline tests (1/2)" and "(2/2)".
jobs:
  frontend:
    name: React desktop assets
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'windows-ci') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, star-ci]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Build and verify React desktop assets
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          sh ../scripts/ci_heavy.sh sh -c 'npm run typecheck && npm run test && npm run build'
          test -s dist/index.html

  windows-tests:
    name: Windows offline tests (${{ matrix.shard }}/2)
    needs: frontend
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'windows-ci') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, windows, star-win-vm]
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # Self-hosted Windows runner = the owner's PC: never let a job see the real user profile
      # (%APPDATA%\STAR holds the owner's chats and settings).
      - name: Use a throwaway user profile for this job
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ci-profile'
          New-Item -ItemType Directory -Force -Path "$root/Roaming", "$root/Local" | Out-Null
          "APPDATA=$root\Roaming" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$root\Local" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-dev.txt
      # Self-hosted runners keep the tool-cache Python between jobs: give this job its own venv.
      - name: Fresh Python environment for this job
        run: python -c "import os,venv; d=os.path.join(os.environ['RUNNER_TEMP'],'job-venv'); venv.create(d, with_pip=True); open(os.environ['GITHUB_PATH'],'a').write(os.path.join(d,'Scripts' if os.name=='nt' else 'bin')+chr(10))"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build and verify React assets on this Windows runner
        shell: pwsh
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'React dependencies could not be installed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'React type checks failed' }
          npm run test
          if ($LASTEXITCODE -ne 0) { throw 'React tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'React build failed' }
          if (-not (Test-Path 'dist/index.html') -or (Get-Item 'dist/index.html').Length -eq 0) {
            throw 'React index missing or empty'
          }
      - name: Install STAR test requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies could not be installed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed' }
      - name: Run offline tests
        shell: pwsh
        env:
          STAR_TEST_SHARD: ${{ matrix.shard }}/2
        run: |
          python -m pytest -q --durations=15 --junitxml=test-results/windows-shard.xml
          if ($LASTEXITCODE -ne 0) { throw 'Offline tests failed' }
          python -m compileall -q star star_desktop.py
      - name: Record this shard's real test result counts without artifact storage
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path 'test-results/windows-shard.xml') {
            [xml]$report = Get-Content 'test-results/windows-shard.xml' -Raw
            $total = $report.SelectNodes('//testcase').Count
            $failed = $report.SelectNodes('//testcase[failure or error]').Count
            $skipped = $report.SelectNodes('//testcase[skipped]').Count
            "Windows shard: $total reported cases; $failed failures/errors; $skipped skipped." >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Windows shard did not produce a test report; do not infer a passing suite.' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Keep this shard's per-test results and timings
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests-shard-${{ matrix.shard }}
          path: test-results/windows-shard.xml
          if-no-files-found: ignore
          retention-days: 3

  windows-build:
    needs: frontend
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'windows-ci') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, windows, star-win-vm]
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      # Self-hosted Windows runner = the owner's PC: never let a job see the real user profile
      # (%APPDATA%\STAR holds the owner's chats and settings).
      - name: Use a throwaway user profile for this job
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ci-profile'
          New-Item -ItemType Directory -Force -Path "$root/Roaming", "$root/Local" | Out-Null
          "APPDATA=$root\Roaming" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$root\Local" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stamp exact source provenance for app diagnostics
        shell: pwsh
        env:
          STAR_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $source = (git rev-parse HEAD).Trim()
          $head = $env:STAR_PR_HEAD_SHA
          if (-not $head) { $head = $source }
          $payload = @{
            schema = 1
            source_commit = $source
            head_commit = $head
            build_event = $env:GITHUB_EVENT_NAME
            run_id = [string]$env:GITHUB_RUN_ID
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText('star/build-info.json', $payload, (New-Object System.Text.UTF8Encoding $false))
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-dev.txt
      # Self-hosted runners keep the tool-cache Python between jobs: give this job its own venv.
      - name: Fresh Python environment for this job
        run: python -c "import os,venv; d=os.path.join(os.environ['RUNNER_TEMP'],'job-venv'); venv.create(d, with_pip=True); open(os.environ['GITHUB_PATH'],'a').write(os.path.join(d,'Scripts' if os.name=='nt' else 'bin')+chr(10))"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build and verify React assets on this Windows runner
        shell: pwsh
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'React dependencies could not be installed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'React type checks failed' }
          npm run test
          if ($LASTEXITCODE -ne 0) { throw 'React tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'React build failed' }
          if (-not (Test-Path 'dist/index.html') -or (Get-Item 'dist/index.html').Length -eq 0) {
            throw 'React index missing or empty'
          }
      - name: Check the React bundle produced on this runner
        shell: pwsh
        run: |
          if (-not (Test-Path 'frontend/dist/index.html')) { throw 'React index missing' }
      - name: Install STAR build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies could not be installed' }
          python -m pip install 'pyinstaller>=6.10,<7'
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller could not be installed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed' }
      - name: Capture real STAR OLED GUI screens for review
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'STAR-CI-Empty-Profile'
          python -m scripts.capture_desktop_ui
          if ($LASTEXITCODE -ne 0) { throw 'GUI capture failed' }
          if (@(Get-ChildItem 'ui-previews/*.png' -File).Count -eq 0) { throw 'GUI previews missing' }
      - name: Package STAR.exe with vector assets
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name STAR `
            --icon assets/star.ico `
            --add-data 'frontend/dist;frontend/dist' --add-data 'star/build-info.json;star' --add-data 'star/skill_packs;star/skill_packs' --add-data 'star/data;star/data' --add-data 'star/studio_lab_specs;star/studio_lab_specs' --add-data 'star/voice/voices.json;star/voice' --add-data 'star/blender_worker.py;star' --add-data 'star/blender_animation_worker.py;star' `
            --hidden-import PySide6.QtWebEngineWidgets --hidden-import PySide6.QtWebChannel `
            --hidden-import mcp.client.session --hidden-import mcp.client.stdio `
            --hidden-import mcp.types --collect-all faster_whisper `
            --collect-all ctranslate2 --collect-all av `
            --collect-all pypdf --collect-all docx --collect-all pptx --collect-all openpyxl `
            --collect-submodules pyttsx3 --collect-submodules jwt --collect-submodules keyring `
            --collect-submodules cryptography --collect-submodules obsws_python star_desktop.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Smoke test actual packaged EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/STAR/STAR.exe').Path
          $doctor = Start-Process -FilePath $exe -ArgumentList '--doctor' -Wait -PassThru
          if ($null -eq $doctor.ExitCode -or $doctor.ExitCode -ne 0) { throw "STAR.exe doctor failed: $($doctor.ExitCode)" }
      - name: Verify React assets included in packaged STAR.exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/STAR/STAR.exe').Path
          $ui = Start-Process -FilePath $exe -ArgumentList '--ui-doctor' -PassThru -Wait
          if ($null -eq $ui.ExitCode -or $ui.ExitCode -ne 0) { throw "STAR React UI bundle missing: $($ui.ExitCode)" }
      - name: Verify binary source attribution matches pull request
        shell: pwsh
        env:
          STAR_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $exe = (Resolve-Path 'dist/STAR/STAR.exe').Path
          $build = Start-Process -FilePath $exe -ArgumentList '--build-doctor' -Wait -PassThru
          if ($null -eq $build.ExitCode -or $build.ExitCode -ne 0) {
            throw "STAR packaged build SHA mismatch or missing metadata: $($build.ExitCode)"
          }
      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/STAR/*' -DestinationPath 'STAR-Genesis-Windows-x64.zip' -Force
      - name: Build upgradeable Windows setup EXE
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup was not installed' }
          $version = (python -c "from star.version import __version__;print(__version__)").Trim()
          & $iscc "/DStarVersion=$version" 'installer/STAR.iss'
          if ($LASTEXITCODE -ne 0) { throw 'STAR installer build failed' }
          $setup = "dist/STAR-Setup-v$version.exe"
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
      - name: Install and smoke test the exact Setup output on the disposable Windows runner
        shell: pwsh
        env:
          STAR_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/smoke_windows_installer.ps1
      - name: Create standalone SHA-256 file for manual preview downloads
        shell: pwsh
        run: |
          $version = (python -c "from star.version import __version__;print(__version__)").Trim()
          $setup = "dist/STAR-Setup-v$version.exe"
          $portable = 'STAR-Genesis-Windows-x64.zip'
          if (-not (Test-Path $setup) -or -not (Test-Path $portable)) { throw 'Preview build files are missing' }
          $setupHash = (Get-FileHash -Path $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -Path $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$setupHash  STAR-Setup-v$version.exe", "$zipHash  STAR-Genesis-Windows-x64.zip") |
            Set-Content -Encoding utf8 'STAR-PREVIEW-SHA256SUMS.txt'
      - name: Admit an explicitly requested preview within the repository byte budget
        id: preview-budget
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.preview_format != 'none'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STAR_PREVIEW_FORMAT: ${{ inputs.preview_format }}
        run: |
          python scripts/check_windows_preview_budget.py
          if ($LASTEXITCODE -ne 0) { throw 'Requested preview exceeds the budget or could not be verified' }
      - name: Record actual package validation
        shell: pwsh
        run: |
          'Packaged EXE doctors and silent installation checks completed on this runner. See each Windows offline-test job for its independent result.' >> $env:GITHUB_STEP_SUMMARY
          'Ordinary PR validation stores no Actions artifacts; optional downloads require a non-main workflow dispatch.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload testable executables
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STAR-Windows-vNext
          path: |
            STAR-Genesis-Windows-x64.zip
            dist/STAR-Setup-v*.exe
            STAR-PREVIEW-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
      # A requested non-main preview uploads exactly one format, never a duplicate
      # combined archive. The byte check includes screenshots and checksum overhead.
      # Main release consumers still use the mandatory exact STAR-Windows-vNext bundle.
      - name: Upload Ultimate preview Windows installer
        if: steps.preview-budget.outputs.format == 'setup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STAR-Ultimate-Windows-Setup
          path: |
            dist/STAR-Setup-v*.exe
            STAR-PREVIEW-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
      - name: Upload Ultimate preview portable ZIP
        if: steps.preview-budget.outputs.format == 'portable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STAR-Ultimate-Windows-Portable
          path: |
            STAR-Genesis-Windows-x64.zip
            STAR-PREVIEW-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload rendered GUI preview screenshots
        if: github.ref == 'refs/heads/main' || steps.preview-budget.outputs.format != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STAR-OLED-GUI-Previews
          path: ui-previews/*.png
          if-no-files-found: error
          retention-days: 3

  # The PR build receives NO attestation or publishing permissions. Only
  # verified main-branch artifacts enter this trusted provenance job.
  attest-release:
    needs: [windows-build, windows-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, star-ci]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download successfully tested Windows binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: STAR-Windows-vNext
          path: attest-input
      - name: Select exactly one Setup and portable binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(find attest-input -type f -name 'STAR-Setup-v*.exe' | wc -l)" -eq 1
          test "$(find attest-input -type f -name 'STAR-Genesis-Windows-x64.zip' | wc -l)" -eq 1
          SETUP="$(find attest-input -type f -name 'STAR-Setup-v*.exe' -print -quit)"
          PORTABLE="$(find attest-input -type f -name 'STAR-Genesis-Windows-x64.zip' -print -quit)"
          test -s "$SETUP" && test -s "$PORTABLE"
          mkdir -p attest-ready
          cp "$SETUP" attest-ready/
          cp "$PORTABLE" attest-ready/
      - name: Attest exact verified Windows release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'attest-ready/*'

  publish-release:
    needs: [windows-build, attest-release]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, star-ci]
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download tested Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: STAR-Windows-vNext
          path: release-assets
      - name: Publish when version is new (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAR_REPO: ${{ github.repository }}
          STAR_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'from star.version import __version__;print(__version__)')"
          TAG="v$VERSION"
          # A delayed build from an old main SHA must not create a release tag
          # pointing at an outdated workflow commit. GitHub denies those writes
          # with 403 even when this job has contents: write.
          MAIN_SHA="$(gh api "repos/$STAR_REPO/commits/main" --jq .sha)"
          if [[ "$MAIN_SHA" != "$STAR_COMMIT" ]]; then
            echo "::notice::Skipping superseded build $STAR_COMMIT; main is $MAIN_SHA"
            exit 0
          fi
          if gh release view "$TAG" --repo "$STAR_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping existing verified binaries."
            exit 0
          fi
          # actions/upload-artifact preserves path components for multi-path inputs.
          # Normalize both assets into a flat release directory.
          SETUP="$(find release-assets -type f -name "STAR-Setup-$TAG.exe" -print -quit)"
          PORTABLE="$(find release-assets -type f -name "STAR-Genesis-Windows-x64.zip" -print -quit)"
          test -n "$SETUP" && test -f "$SETUP"
          test -n "$PORTABLE" && test -f "$PORTABLE"
          mkdir -p release-ready
          cp "$SETUP" "release-ready/STAR-Setup-$TAG.exe"
          cp "$PORTABLE" release-ready/STAR-Genesis-Windows-x64.zip
          # Verify the repository, signer workflow, source SHA and source ref.
          # A passing build or a SHA-256 checksum alone is not enough to publish.
          for artifact in "release-ready/STAR-Setup-$TAG.exe" "release-ready/STAR-Genesis-Windows-x64.zip"; do
            gh attestation verify "$artifact" --repo "$STAR_REPO" \
              --signer-workflow "$STAR_REPO/.github/workflows/windows-desktop.yml" \
              --source-digest "$STAR_COMMIT" --source-ref "refs/heads/main"
          done
          ( cd release-ready && sha256sum "STAR-Setup-$TAG.exe" STAR-Genesis-Windows-x64.zip ) > release-ready/SHA256SUMS.txt
          gh release create "$TAG" "release-ready/STAR-Setup-$TAG.exe" release-ready/STAR-Genesis-Windows-x64.zip release-ready/SHA256SUMS.txt \
            --repo "$STAR_REPO" --target "$STAR_COMMIT" --title "STAR Intelligence $TAG" --generate-notes

name: STAR read-only artifact inventory
on:
  push:
    paths: ['.github/workflows/artifact-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: star-artifact-inventory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'oncoursemail/Star-AI-Private'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, artifact upload, deletion, billing mutation, or release key.
      - name: Inventory retained files and possible duplicate preview copies
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import datetime, json, os, urllib.error, urllib.request
          REPO = 'oncoursemail/Star-AI-Private'
          REPO_ID = 1412474221
          ROOT = 'https://api.github.com/repos/' + REPO
          GIB = 1024 ** 3
          MAX_PAGES = 100
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          def get(path):
              if path != '' and not path.startswith('/actions/artifacts?per_page=100&page='):
                  raise ValueError('Endpoint outside read-only inventory scope')
              request = urllib.request.Request(ROOT + path, method='GET', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'STAR-storage-inventory'})
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              try:
                  with opener.open(request, timeout=15) as response:
                      raw = response.read(2_000_001)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('GitHub inventory request failed: HTTP ' + str(exc.code)) from None
              except urllib.error.URLError:
                  raise RuntimeError('GitHub inventory request unavailable') from None
              if len(raw) > 2_000_000:
                  raise ValueError('Inventory response exceeded limit')
              return json.loads(raw)
          def collect(read):
              metadata = read('')
              if (type(metadata.get('id')) is not int or metadata['id'] != REPO_ID
                      or metadata.get('full_name') != REPO or metadata.get('private') is not True):
                  raise ValueError('Private source identity or visibility mismatch')
              seen, totals, duplicates = {}, [], False
              complete = False
              for page in range(1, MAX_PAGES + 1):
                  data = read('/actions/artifacts?per_page=100&page=' + str(page))
                  batch, total = data.get('artifacts'), data.get('total_count')
                  if not isinstance(batch, list) or type(total) is not int or total < 0 or len(batch) > 100:
                      raise ValueError('Invalid artifact page')
                  totals.append(total)
                  for item in batch:
                      if (not isinstance(item, dict) or type(item.get('id')) is not int or item['id'] < 1
                              or type(item.get('size_in_bytes')) is not int or item['size_in_bytes'] < 0
                              or type(item.get('expired')) is not bool or not isinstance(item.get('name'), str)):
                          raise ValueError('Invalid artifact record')
                      run = item.get('workflow_run') or {}
                      if not isinstance(run, dict) or run.get('repository_id') not in (None, REPO_ID):
                          raise ValueError('Unexpected artifact repository')
                      duplicates = duplicates or item['id'] in seen
                      seen[item['id']] = item
                  if len(batch) < 100:
                      complete = len(seen) == total and len(set(totals)) == 1 and not duplicates
                      break
              return list(seen.values()), complete, totals[-1]
          def summarize(items, complete, total):
              active = [item for item in items if item['expired'] is False]
              groups, by_run = {}, {}
              for item in active:
                  group = groups.setdefault(item['name'], {'name': item['name'], 'count': 0, 'bytes': 0})
                  group['count'] += 1
                  group['bytes'] += item['size_in_bytes']
                  run_id = (item.get('workflow_run') or {}).get('id')
                  if type(run_id) is int:
                      by_run.setdefault(run_id, {}).setdefault(item['name'], []).append(item)
              suspects = []
              names = ('STAR-Fast-Brain-Preview', 'STAR-Ultimate-Windows-Setup', 'STAR-Ultimate-Windows-Portable')
              for run_id, artifacts in by_run.items():
                  if not all(len(artifacts.get(name, [])) == 1 for name in names):
                      continue
                  combined, setup, portable = (artifacts[name][0] for name in names)
                  records = [item.get('workflow_run') or {} for item in (combined, setup, portable)]
                  sha = records[0].get('head_sha')
                  branch = records[0].get('head_branch')
                  if (not isinstance(sha, str) or len(sha) != 40 or not branch or branch == 'main'
                          or any(r.get('head_sha') != sha or r.get('head_branch') != branch for r in records)):
                      continue
                  suspects.append({'run_id': run_id, 'combined_id': combined['id'],
                      'combined_bytes': combined['size_in_bytes'], 'split_ids': [setup['id'], portable['id']],
                      'status': 'review-required; archive contents and active-review needs not verified'})
              return {'schema': 1, 'repository': REPO, 'inventory_complete': complete,
                  'reported_artifacts': total, 'listed_artifacts': len(items), 'retained_artifacts': len(active),
                  'listed_retained_bytes': sum(item['size_in_bytes'] for item in active),
                  'largest_groups': sorted(groups.values(), key=lambda group: group['bytes'], reverse=True)[:12],
                  'possible_duplicate_groups': sorted(suspects, key=lambda item: item['combined_bytes'], reverse=True)[:12],
                  'possible_duplicate_group_count': len(suspects),
                  'possible_duplicate_combined_bytes': sum(item['combined_bytes'] for item in suspects),
                  'account_quota_known': False, 'deletions_performed': 0,
                  'note': 'Repository inventory is not account-wide billed storage. No artifact is approved for deletion by this report.'}
          def main():
              items, complete, total = collect(get)
              report = summarize(items, complete, total)
              report['observed_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              output = json.dumps(report, indent=2, ensure_ascii=True)
              print('STAR_ARTIFACT_INVENTORY_JSON\n' + output)
              # Job summaries and logs require no artifact upload; encode free-form names.
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  safe = output.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                  with open(summary, 'a', encoding='utf-8') as handle:
                      handle.write('# STAR read-only storage inventory\n\n<pre>' + safe + '</pre>\n')
          if __name__ == '__main__':
              main()

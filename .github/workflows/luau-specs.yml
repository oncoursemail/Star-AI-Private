name: Luau template specs

# Runs every examples/**/*.spec.luau on the official standalone Luau CLI, pinned by
# release tag and by the SHA-256 that GitHub publishes for that release asset.
# Raising the version means changing LUAU_VERSION and LUAU_ZIP_SHA256 together.
on:
  push:
    branches: [main, 'star/**']
    paths:
      - 'examples/**'
      - 'scripts/run_luau_specs.py'
      - 'scripts/luau_quality_smoke.py'
      - 'star/luau_lint.py'
      - 'star/luau_analyze.py'
      - 'star/roblox_craft.py'
      - 'tests/test_luau_analyze.py'
      - '.github/workflows/luau-specs.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'scripts/run_luau_specs.py'
      - 'scripts/luau_quality_smoke.py'
      - 'star/luau_lint.py'
      - 'star/luau_analyze.py'
      - 'star/roblox_craft.py'
      - 'tests/test_luau_analyze.py'
      - '.github/workflows/luau-specs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LUAU_VERSION: '0.691'
  LUAU_ZIP_SHA256: '9b7699968c911beb3781f682c6be298440879ae279ff352d36dd58603418de2b'

jobs:
  luau-specs:
    runs-on: [self-hosted, linux, star-ci]
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned official Luau Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/luau-ubuntu.zip"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$zip" \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          echo "${LUAU_ZIP_SHA256}  ${zip}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/luau"
          unzip -q "$zip" -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
      - name: Run every Luau spec
        run: python3 scripts/run_luau_specs.py

  luau-quality-smoke:
    name: Pinned Luau analyzer smoke
    runs-on: [self-hosted, linux, star-ci]
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch checksum-pinned official analyzer without administrator installation
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/luau-ubuntu.zip"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$zip" \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          echo "${LUAU_ZIP_SHA256}  ${zip}" | sha256sum --check
          dest="$RUNNER_TEMP/tools/luau-${LUAU_VERSION}"
          mkdir -p "$dest"
          unzip -q "$zip" -d "$dest"
          chmod +x "$dest/luau-analyze"
          test -x "$dest/luau-analyze"
      - name: Run adapter against three STAR-derived Luau snippets
        env:
          STAR_LUAU_ANALYZE: 'on'
          STAR_LUAU_TOOLS_DIR: ${{ runner.temp }}/tools
        run: python3 -m scripts.luau_quality_smoke

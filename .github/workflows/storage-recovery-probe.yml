name: STAR storage recovery probe
on:
  push:
    branches: ['maintenance/verified-artifact-cleanup-20261019']
    paths: ['.github/workflows/storage-recovery-probe.yml']
permissions:
  contents: read
  actions: write
jobs:
  probe:
    if: github.repository == 'oncoursemail/Star-AI-Private' && github.actor_id == '84545815'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create a tiny non-sensitive storage probe
        shell: python
        run: |
          from pathlib import Path
          Path('storage-probe.txt').write_text('STAR artifact upload check; no user data.\n', encoding='utf-8')
      - name: Test whether artifact uploads are actually accepted
        id: probe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STAR-storage-probe-${{ github.run_id }}
          path: storage-probe.txt
          if-no-files-found: error
          retention-days: 1
      - name: Verify and remove only this run's probe artifact
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_ID: ${{ steps.probe.outputs.artifact-id }}
        run: |
          import json, os, urllib.error, urllib.request
          identifier=os.environ['PROBE_ID']
          run=os.environ['GITHUB_RUN_ID']
          if not identifier.isdigit() or not run.isdigit():
              raise RuntimeError('Probe identity missing')
          root='https://api.github.com/repos/oncoursemail/Star-AI-Private/actions/artifacts/'+identifier
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          def request(method):
              req=urllib.request.Request(root,method=method,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with opener.open(req,timeout=20) as response:
                  return response.status,response.read(100000)
          status,raw=request('GET')
          data=json.loads(raw)
          source=data.get('workflow_run') or {}
          if (data.get('id')!=int(identifier) or data.get('name')!='STAR-storage-probe-'+run
              or source.get('id')!=int(run) or source.get('repository_id')!=1412474221
              or not 0<data.get('size_in_bytes',0)<10000):
              raise RuntimeError('Refusing deletion: this is not the current small probe')
          if request('DELETE')[0]!=204:
              raise RuntimeError('Probe cleanup not confirmed')
          try:
              request('GET')
          except urllib.error.HTTPError as exc:
              if exc.code!=404:
                  raise
          else:
              raise RuntimeError('Probe still exists')
          print('ARTIFACT_UPLOAD_ACCEPTED=true; probe_removed=true; production_release=false')

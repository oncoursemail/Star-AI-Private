name: Protected closure
# W2: a diff from a generator branch (star/chatgpt-*, star/autopilot-*, star/night-school-outbox-*, star/outbox-*,
# star/selfbuild-*, star/genesis-*, star/gen-*) must not touch evals, graders, the holdout, stored results or the gate
# (list: star/protected_paths.py). pull_request_target runs THIS workflow and the guard script from the base branch,
# so a pull request cannot weaken its own check; the pull request's code is only diffed, never executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: ['star/chatgpt-*', 'star/autopilot-*', 'star/night-school-outbox-*', 'star/outbox-*',
               'star/selfbuild-*', 'star/genesis-*', 'star/gen-*']
permissions:
  contents: read
concurrency:
  group: protected-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    name: Generators do not edit evals, graders or the gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check the pull request diff with the base branch's guard
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Diff the exact commit from this event. A virtual pull/N/head ref can be
          # unavailable even after the private repository checkout succeeds, and
          # a branch may move between the event and this step. Never substitute its
          # newer tip or run any code from the pull request.
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            # The full checkout normally already has same-repository PR commits.
            # A command-local helper keeps the read-only token out of .git/config.
            git -c credential.helper='!gh auth git-credential' fetch --no-tags origin "$HEAD_SHA"
          fi
          test "$(git rev-parse "${HEAD_SHA}^{commit}")" = "$HEAD_SHA"
          cp star/protected_paths.py "$RUNNER_TEMP/guard.py"
          git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/changed.txt"
          xargs -a "$RUNNER_TEMP/changed.txt" -d '\n' python "$RUNNER_TEMP/guard.py" --branch "$HEAD_BRANCH" --labels "$LABELS" --files
      - name: Check a pushed generator branch against star/next
        if: github.event_name == 'push'
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c credential.helper='!gh auth git-credential' fetch --no-tags origin star/next
          cp star/protected_paths.py "$RUNNER_TEMP/guard.py"
          git show origin/star/next:star/protected_paths.py > "$RUNNER_TEMP/guard.py" 2>/dev/null || true
          git diff --name-only --no-renames "origin/star/next...${GITHUB_SHA}" > "$RUNNER_TEMP/changed.txt"
          xargs -a "$RUNNER_TEMP/changed.txt" -d '\n' python "$RUNNER_TEMP/guard.py" --branch "$HEAD_BRANCH" --files

name: Dependency vulnerability audit
on:
  push:
    branches: [main]
    paths: [requirements.txt, '.github/workflows/dependency-audit.yml']
  pull_request:
    paths: [requirements.txt, '.github/workflows/dependency-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pip-audit:
    runs-on: [self-hosted, linux, star-ci]
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Self-hosted runners keep the tool-cache Python between jobs: give this job its own venv.
      - name: Fresh Python environment for this job
        run: python -c "import os,venv; d=os.path.join(os.environ['RUNNER_TEMP'],'job-venv'); venv.create(d, with_pip=True); open(os.environ['GITHUB_PATH'],'a').write(os.path.join(d,'Scripts' if os.name=='nt' else 'bin')+chr(10))"
      - name: Audit Python dependency declarations
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt

name: Discord gateway offline verification

on:
  pull_request:
    paths:
      - "star/discord_bot/**"
      - "tests/test_discord_bot.py"
      - "tests/test_discord_owner_dm.py"
      - "tests/test_discord_learning_digests.py"
      - "tests/test_discord_gateway_fake.py"
      - "tests/test_discord_draw.py"
      - "tests/test_discord_server_mode.py"
      - "tests/test_discord_star_awareness.py"
      - "star/persona.py"
      - "server/discord/**"
      - "scripts/star_discord.cmd"
      - "requirements-discord.txt"
      - "scripts/star_discord_windows.ps1"
      - "scripts/test_star_discord_windows_setup.ps1"
      - ".github/workflows/discord-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discord-offline:
    name: Discord gateway / ${{ matrix.os }}
    # The Windows leg needs the owner's PC runner (started on demand), so it runs only on a manual dispatch.
    runs-on: ${{ matrix.os == 'windows' && fromJSON('["self-hosted","windows","star-win"]') || fromJSON('["self-hosted","linux","star-ci"]') }}
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["linux","windows"]' || '["linux"]') }}
    steps:
      # Self-hosted Windows runner = the owner's PC: never let a job see the real user profile
      # (%APPDATA%\STAR holds the owner's chats and settings).
      - if: runner.os == 'Windows'
        name: Use a throwaway user profile for this job
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ci-profile'
          New-Item -ItemType Directory -Force -Path "$root/Roaming", "$root/Local" | Out-Null
          "APPDATA=$root\Roaming" >> $env:GITHUB_ENV
          "LOCALAPPDATA=$root\Local" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      # Self-hosted runners keep the tool-cache Python between jobs: give this job its own venv.
      - name: Fresh Python environment for this job
        run: python -c "import os,venv; d=os.path.join(os.environ['RUNNER_TEMP'],'job-venv'); venv.create(d, with_pip=True); open(os.environ['GITHUB_PATH'],'a').write(os.path.join(d,'Scripts' if os.name=='nt' else 'bin')+chr(10))"
      - name: Install regular STAR and Discord dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-discord.txt
      - name: Verify Discord gateway source compiles
        run: python -m compileall -q star/discord_bot
      - name: Verify Windows Discord setup helper is syntactically valid
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/star_discord_windows.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'Invalid Discord setup PowerShell' }
      - name: Exercise encrypted Windows setup with fake input (no network)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test_star_discord_windows_setup.ps1
      - name: Exercise owner permissions, AI stubs, commands, audio and startup diagnostics
        run: python -m pytest -q tests/test_discord_bot.py tests/test_discord_owner_dm.py tests/test_discord_learning_digests.py tests/test_discord_gateway_fake.py tests/test_discord_draw.py tests/test_discord_server_mode.py tests/test_discord_star_awareness.py
      - name: Offline doctor must not require a token or remote service
        run: python -m star.discord_bot doctor
        continue-on-error: true

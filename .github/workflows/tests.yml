name: STAR offline checks
on:
  push:
    branches: [main, 'star/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: star-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Documentation-only changes skip the work inside these jobs (the jobs still report success).
  # The decision runs as each job's first step (.github/actions/changed-scope ->
  # scripts/ci_changed_scope.py), not as a separate job, so code changes wait for no extra runner.
  # It fails towards running everything; a document that a test or source file names (README.md,
  # release checklists, agent notes...) still runs the tests.
  checks:
    name: Offline Python checks
    runs-on: [self-hosted, linux, star-ci]
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    # Covers setup, the suite (~6.5 min alone on the 4-CPU runner) and waiting for the shared heavy-job lock.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/changed-scope
        continue-on-error: true
      - name: Documentation-only change, Python checks not needed
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "::notice::Documentation-only change (scripts/ci_changed_scope.py); Python checks skipped"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      # Self-hosted runners keep the tool-cache Python between jobs: give this job its own venv.
      - name: Fresh Python environment for this job
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: python -c "import os,venv; d=os.path.join(os.environ['RUNNER_TEMP'],'job-venv'); venv.create(d, with_pip=True); open(os.environ['GITHUB_PATH'],'a').write(os.path.join(d,'Scripts' if os.name=='nt' else 'bin')+chr(10))"
      - name: Install reviewed dependencies and pytest
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: python -m pip install -r requirements.txt pytest pytest-xdist==3.8.0
      - name: Compile Python sources
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: python -m compileall -q star main.py
      - name: Lint star/ with ruff (correctness rules in pyproject.toml)
        run: |
          python -m pip install ruff==0.16.9
          ruff check star --output-format=github
      - name: Validate research evaluation catalog
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: python -m pytest -q tests/test_star_research.py
      - name: Run all offline regression tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        # One heavy step at a time on the shared runner machine (scripts/ci_heavy.sh). Four workers: the
        # suite mostly waits, so on the 4-CPU runner it takes ~6.5 min instead of ~11 (measured alone).
        run: sh scripts/ci_heavy.sh python -m pytest -q -n 4

  react:
    name: React UI compile and tests
    runs-on: [self-hosted, linux, star-ci]
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/changed-scope
        continue-on-error: true
      - name: Documentation-only change, React checks not needed
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "::notice::Documentation-only change (scripts/ci_changed_scope.py); React checks skipped"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install reviewed frontend dependencies
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: npm install --prefix frontend --no-audit --no-fund
      - name: Typecheck React and validate components
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: |
          sh scripts/ci_heavy.sh sh -c 'npm run typecheck --prefix frontend && npm run test --prefix frontend && npm run build --prefix frontend'
      - name: Confirm built offline application entry point
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: test -s frontend/dist/index.html
      - name: Capture actual React website, desktop and mobile screenshots
        if: ${{ always() && steps.scope.outputs.docs_only != 'true' }}
        continue-on-error: true
        run: |
          test -s frontend/dist/index.html || exit 0
          mkdir -p react-qa
          python3 -m http.server 8931 --bind 127.0.0.1 --directory frontend/dist >/tmp/star-react-qa.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "::notice::Chrome not available for React visual QA"
            exit 0
          fi
          timeout 45 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=2300 --screenshot="$PWD/react-qa/website-desktop.png" 'http://127.0.0.1:8931/?visualqa=1'
          timeout 45 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=2300 --screenshot="$PWD/react-qa/chat-desktop.png" 'http://127.0.0.1:8931/?preview=1'
          timeout 45 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=2300 --screenshot="$PWD/react-qa/brain-desktop.png" 'http://127.0.0.1:8931/?preview=1&tab=brain'
          timeout 45 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=2300 --screenshot="$PWD/react-qa/projects-desktop.png" 'http://127.0.0.1:8931/?preview=1&tab=projects'
          timeout 45 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=2300 --screenshot="$PWD/react-qa/settings-desktop.png" 'http://127.0.0.1:8931/?preview=1&tab=settings'
          timeout 45 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --virtual-time-budget=2300 --screenshot="$PWD/react-qa/chat-mobile.png" 'http://127.0.0.1:8931/?preview=1'
          timeout 45 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --virtual-time-budget=2300 --screenshot="$PWD/react-qa/website-mobile.png" 'http://127.0.0.1:8931/?visualqa=1'
          test -s react-qa/website-desktop.png
          test -s react-qa/chat-desktop.png
      - name: Upload actual React browser renders
        # Review evidence is not a handoff or a prerequisite for any offline test.
        # PRs and star/** pushes must validate even when artifact storage is full.
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STAR-v08-React-Visual-QA
          path: react-qa/*.png
          if-no-files-found: ignore
          retention-days: 3

  pyright:
    name: Python types (pyright basic, baseline gate)
    runs-on: [self-hosted, linux, star-ci]
    if: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Self-hosted runners keep the tool-cache Python between jobs: give this job its own venv.
      - name: Fresh Python environment for this job
        run: python -c "import os,venv; d=os.path.join(os.environ['RUNNER_TEMP'],'job-venv'); venv.create(d, with_pip=True); open(os.environ['GITHUB_PATH'],'a').write(os.path.join(d,'Scripts' if os.name=='nt' else 'bin')+chr(10))"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # No third-party packages on purpose: their stubs change between releases, so the
      # baseline stays stable and only STAR's own code is judged.
      - name: Run pyright on star/ (settings in pyrightconfig.json)
        run: sh scripts/ci_heavy.sh npx --yes pyright@1.1.414 --pythonpath "$(command -v python)" --outputjson > pyright.json || test -s pyright.json
      - name: Fail on errors beyond scripts/pyright_baseline.json
        run: python scripts/pyright_baseline.py check pyright.json

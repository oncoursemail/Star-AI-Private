[package]
name = "litha-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false
description = "Optional exact dense retrieval accelerator for Litha's local docs index"

[lib]
name = "litha_search"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.27.2", features = ["abi3-py311"] }

[profile.release]
lto = "thin"
codegen-units = 1

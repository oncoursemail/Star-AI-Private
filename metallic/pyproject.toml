[project]
name = "metallic"
version = "0.1.0"
description = "Metallic layer: merge queue on the combined tree, test-impact selection, result cache, built-in checks"
requires-python = ">=3.11"

[project.optional-dependencies]
# metallic accounts (metallic/accounts); Ubuntu 24.04: apt install python3-argon2 python3-cryptography
accounts = ["argon2-cffi>=21.1", "cryptography>=41"]

[project.scripts]
metallic = "metallic.cli:main"

[tool.setuptools]
packages = ["metallic"]

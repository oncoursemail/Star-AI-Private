version = 1

; STAR Brain router presets. llama.cpp b11541 router mode. Applied 2026-10-11; prompt-cache size added 2026-10-13.
; Evidence: docs/research/server-inference.md, docs/agents/brain-performance-20261013.md. Apply with: bash server/brain/apply.sh
;
; Lines read by apply-remote.sh (they are comments for llama-server):
; ram-gb: 70
; move: /opt/star/models-candidates/mellum2.1-12b/Mellum2.1-12B-A2.5B-Thinking-Q4_K_M.gguf /opt/star/models/mellum2.1-12b/Mellum2.1-12B-A2.5B-Thinking-Q4_K_M.gguf
; move: /opt/star/models-candidates/qwen3.8-27b/Qwen3.8-27B-Q4_K_M.gguf /opt/star/models/qwen3.8-27b/Qwen3.8-27B-Q4_K_M.gguf
; move: /opt/star/models-candidates/qwen3.8-27b/mtp-Qwen3.8-27B-Q4_0.gguf /opt/star/models/qwen3.8-27b/mtp-Qwen3.8-27B-Q4_0.gguf
;
; Placement comes from the service unit, not from this file: the router is started under
; `numactl --interleave=all` with `--numa distribute`, and every model process inherits both.
; Thread counts live HERE (the unit no longer passes --threads/--threads-batch, which used to override this file).

[*]
jinja = true
flash-attn = on
; DirectIO load: same speed as a normal read, but leaves no 20 GB copy of the file in the page cache, which would
; fill memory nodes and break the interleaving of the next model that loads.
load-mode = dio
; 24 generation threads = one per physical core (6 per memory node); 48 batch threads = all hardware threads.
; Measured on star-fast: 24/48 gives the best generation AND the best prompt processing (section 2.1, 2.2).
threads = 24
threads-batch = 48
dedup-cache-models = true

; Default brain: chat, Roblox/Luau coding, tool calls, vision. Qwen3.6-35B-A3B MoE (3B active) Q4_K_M.
; Measured with this placement: 8.1-10.5 tok/s (live today: 4.6), prompt 60-71 tok/s, first token 1.2-1.7 s on a short
; prompt, 0.3-0.9 s on a cached conversation. MTP and DFlash drafts both measured slower (2.3); the DSpark draft below wins.
; KV cache left at the default f16: q8_0 was 24% slower on prompt processing at 4K depth and saves only 1.7 GB.
[star-fast]
model = /opt/star/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-Q4_K_M.gguf
mmproj = /opt/star/models/qwen3.6-35b-a3b/mmproj-Qwen3.6-35B-A3B-Q8_0.gguf
alias = star-code,star-vision
; Speculative decoding on star-fast's own weights (speed-20261020, docs/agents/speed-20261020.md): DSpark draft head
; (RedHatAI Qwen3.6-35B-A3B-speculator.dspark, Apache-2.0; GGUF Anbeeld rev c906bddc Q4_K_M, 0.57 GB, +0.9 GB RSS)
; plus ngram-mod, 2-token draft (acceptance 55-73%). Measured under the quiet lock, 8 fixed greedy prompts:
; single stream 9.1 -> 11.0 tok/s (+20%), two streams 12.8 -> 16.4 tok/s aggregate (+28%; 6.6 -> 10.6 per stream),
; prompt speed and first token unchanged, vision (mmproj) still works. Lossless by design: the greedy text differs
; from the no-draft text only by float rounding, exactly as batching two slots does. Rollback: delete these three
; lines and GET /models?reload=1 (reloads star-fast only).
spec-type = draft-dspark,ngram-mod
model-draft = /opt/star/models/qwen3.6-35b-a3b-dspark/Qwen3.6-35B-A3B-DSpark-Q4_K_M.gguf
spec-draft-n-max = 2
ctx-size = 65536
parallel = 2
reasoning = off
load-on-startup = true
; RAM prompt cache (default 8192 MiB). With night school, agents and chats sharing two slots the 8 GB cache was full and
; evicting all day (320 evictions in 24 h on 2026-10-13, entries 200-360 MiB): a conversation evicted from it has to be
; re-read (about 70 tok/s, 20 s per 1,400 tokens) instead of restored (about 1-1.5 s). The box has about 80 GB spare RAM.
cache-ram = 24576
; 24 batch threads instead of 48 (speed-round3-20261015). When other work shares the CPU (2026-10-15: ~8.5 busy cores
; from another container), 48 batch threads wait on the busy hardware threads: prompt reading of an 83-token chat took
; 11.4 s at 48 and 3.2 s at 24, next-turn first token 9.4 s vs 1.6 s. Greedy text identical. Cost on an idle box: about
; -12% prompt speed (72 vs 64 tok/s, docs/research/20261012/cpu-speed.md). Rollback: delete this line.
threads-batch = 24
; chat-slot-20261020: background work (night school, conductor, evals, playtest, Studio Lab) names only the
; background slots 1..min(2, parallel - 1) (star/background_cap.py), so slot 0 always stays free for the owner's chat;
; with two slots background runs one request at a time. Measured: two background clients busy, chat first token
; 29.5 s uncapped -> 4.7 s capped. parallel = 3 + ctx-size = 98304 was tried live (two background streams at once):
; chat first token 2.4-9.3 s (median ~8 s; a new prompt is read slowly while two speculative streams decode), so it
; stays at 2. Notes: docs/agents/chat-slot-20261020.md.

; Fast chat and voice: Mellum2.1-12B-A2.5B MoE (2.5B active) Q4_K_M, Apache-2.0, text only.
; Measured: 24-25 tok/s, prompt 109 tok/s, first token 0.6-0.8 s on a short prompt. Does not reason with reasoning=off.
[star-voice]
model = /opt/star/models/mellum2.1-12b/Mellum2.1-12B-A2.5B-Thinking-Q4_K_M.gguf
alias = star-quick
; The model's own template drops the empty think block from earlier answers, while the generation prompt (thinking
; off) ends with one: every follow-up re-read the previous answer (2026-10-13: turn 3 re-read 195 tokens). This copy
; renders earlier answers exactly as generated (templates/mellum-keep-empty-think.jinja, checked on this build with
; /apply-template). apply.sh ships the file to /opt/star/config/templates/.
chat-template-file = /opt/star/config/templates/mellum-keep-empty-think.jinja
ctx-size = 32768
parallel = 2
reasoning = off
load-on-startup = true
; speed-round3-20261015: 24 batch threads as for star-fast; under CPU contention prompt reading 5.7 -> 2.2 s (chat),
; short first token 3.5 -> 1.2 s, next turn 4.9 -> 1.3 s; greedy text identical. Rollback: delete this line.
threads-batch = 24

; Slow, best quality, for queued work only: Qwen3.8-27B dense Q4_K_M with its own MTP draft head.
; Measured: 2.3 tok/s plain, 4.1 (prose) to 5.5 (code) tok/s with MTP; prompt 10-13 tok/s (1,400 tokens = 105 s).
; Thinking is left at the model default (on); send chat_template_kwargs {"enable_thinking": false} to skip it.
[star-deep]
model = /opt/star/models/qwen3.8-27b/Qwen3.8-27B-Q4_K_M.gguf
spec-type = draft-mtp
model-draft = /opt/star/models/qwen3.8-27b/mtp-Qwen3.8-27B-Q4_0.gguf
spec-draft-n-max = 3
ctx-size = 32768
parallel = 1
; Lead decision 2026-10-11: loaded on first use, not at start. It did not beat star-fast in the spot checks, and
; loading it costs 22.8 GB and about 80 s of every restart. The first request to it waits for the load.
load-on-startup = false

; Retrieval models are capped so that an embedding job cannot starve chat. With the old 24/48 threads a knowledge-base
; build pushed chat generation down to 0.8 tok/s. Measured throughput: embeddings 556 tok/s with 8 threads
; (1,343 with 48); reranker 234 / 334 / 394 tok/s with 12 / 24 / 48 threads.
; Embedding is the long-running job, so it gets 8 threads. Reranking is a short burst in front of an answer, so it
; gets one thread per physical core (24) but no hyperthreads.
[star-embed]
model = /opt/star/models/embeddinggemma-300m/embeddinggemma-300M-Q8_0.gguf
embedding = true
threads = 8
threads-batch = 8
load-on-startup = true

[star-rerank]
model = /opt/star/models/qwen3-reranker-0.6b/qwen3-reranker-0.6b-q8_0.gguf
rerank = true
threads = 24
threads-batch = 24
; loaded on first use only: no live search reranks (service and app use vector); frees ~5.8 GB, first call ~9 s
load-on-startup = false
; no RAM prompt cache: rerank prompts are one-off (query + document); the default 8 GB cache grew the process to
; 14 GB with no speed gain (measured 2026-10-14, docs/agents/rerank-speed-20261014.md)
cache-ram = 0

; Fine-tuned embedding model (added on the live server 2026-10-13, copied here so apply.sh does not drop it).
[star-embed-ft1]
model = /opt/star/models/embeddinggemma-300m-star-ft1/embeddinggemma-300m-star-ft1-Q8_0.gguf
embedding = true
threads = 8
threads-batch = 8
load-on-startup = true

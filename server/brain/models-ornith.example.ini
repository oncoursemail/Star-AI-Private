; OPTIONAL ORNITH CANDIDATE CONFIGURATION FOR LITHA
; ---------------------------------------------------------------------------
; This file is intentionally NOT loaded by server/brain/apply.sh.
; Copy/adapt a section only after downloading a verified GGUF from a trusted
; source, recording its checksum, and running Litha's paired benchmark gate.
;
; Ornith-1.5 advertises 262144 native context. Do not start there on consumer
; hardware. KV cache + runtime overhead can exceed the memory left after model
; weights. Start small, measure, then expand.
;
; 8 GB RTX 4060-class candidate:
; [litha-ornith-9b]
; model = /opt/litha/models/ornith-1.5-9b/Ornith-1.5-9B-Q4_K_M.gguf
; mmproj = /opt/litha/models/ornith-1.5-9b/mmproj-Ornith-1.5-9B.gguf
; alias = litha-ornith-code,litha-ornith-agent
; ctx-size = 32768
; parallel = 1
; jinja = true
; flash-attn = on
; load-on-startup = false
;
; Promotion rules:
; 1. Never replace the preferred model from marketing/benchmark screenshots.
; 2. Record cold load, TTFT, prompt tok/s, generation tok/s, peak VRAM/RAM.
; 3. Run coding + tool-use + loop-termination regressions.
; 4. Run vision regressions if a projector is present.
; 5. Compare paired outputs against the current Litha route.
; 6. Promote only when quality is non-inferior and latency/memory are acceptable.
;
; 35B is ~23 GB in the current Ollama Q4_K_M package and belongs on a 24 GB+
; workstation or high-RAM server. 122B and 397B are server/multi-GPU research
; candidates, not consumer-GPU defaults.

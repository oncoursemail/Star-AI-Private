// NeoForge mod template (ModDevGradle, NeoForge 21.11.48 for Minecraft 1.21.11, official Mojang names)
plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = '1.0.0'
group = 'com.example'
base { archivesName = 'testmod' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.11.48'
    runs { server { server(); programArgument '--nogui' } }
    mods { testmod { sourceSet(sourceSets.main) } }
}
tasks.register('cpOut', Copy) { from(sourceSets.main.compileClasspath); into('/opt/mcp/cp/neoforge') }

name: Litha Bridge (offline)
on:
  push:
    paths:
      - 'src/litha_bridge/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.env.example'
      - '.github/workflows/bridge-tests.yml'
  pull_request:
    paths:
      - 'src/litha_bridge/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.env.example'
      - '.github/workflows/bridge-tests.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated HTTP API tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
